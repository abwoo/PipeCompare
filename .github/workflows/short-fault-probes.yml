name: Native ICA checkpoint parity probe
on:
  push:
    branches: [codex/optimization-probes-20261025]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: abwoo/PipeCompare
          ref: ce57d751c2df64823265bc7c026b4c049fb0667d
          path: PipeCompare
      - uses: ./PipeCompare/.github/actions/setup-2026
      - name: Run the three native checkpoint regression tests first
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            cd PipeCompare;addpath(pwd);addpath(fullfile(pwd,'tests'));
            suite=test_engine;
            names={'test_engine/testIcaCheckpointPreservesNativeOutputAndRandomState','test_engine/testResumeRetainsIcaSeedsAndRecommendation','test_engine/testTimeSliceRequiresCheckpointAndCanResume'};
            suite=suite(ismember({suite.Name},names));assert(numel(suite)==3);
            r=run(suite);disp(r);assert(all([r.Passed])&&~any([r.Incomplete]),'Checkpoint parity failed');
