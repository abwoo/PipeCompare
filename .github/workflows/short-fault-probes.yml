name: Stop superseded fallback-backend experiment
on:
  push:
    branches: [codex/optimization-probes-20261025]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const replacement=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40159157180});
            if(replacement.data.head_sha!=='5e22e7534be739dea0d7a41ef4b95c92038f51fc')throw new Error('Replacement changed');
            const js=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:40159157180,per_page:100});
            if(!js.some(j=>j.name==='plan'&&j.conclusion==='success')||js.filter(j=>/^Paired (public participant|simulation seed) /.test(j.name)).length!==8)throw new Error('Replacement incomplete');
            const old=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40157535539});
            if(old.data.head_sha!=='7a47327cf8d5185476f94bfd6e6f7797fbf1cdfb')throw new Error('Obsolete source changed');
            if(old.data.status!=='completed')await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:40157535539});
            core.info('Stopped only the superseded fallback-backend run; current compiled-backend study continues.');
