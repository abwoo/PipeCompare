name: Cancel duplicate queued recovery only
on:
  push:
    branches: [codex/optimization-probes-20261025]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keep=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:40189377057})).data;
            const duplicate=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:40189384016})).data;
            if(keep.head_sha!=='ce57d751c2df64823265bc7c026b4c049fb0667d'||keep.status!=='in_progress')throw new Error('Expected recovery is not active');
            if(duplicate.head_sha!=='2893731090d1c179526995e06417c63c81772971'||duplicate.head_branch!=='codex/optimization-recovery-20261025')throw new Error('Unexpected duplicate');
            if(duplicate.status==='completed')return;
            if(!['queued','pending','waiting'].includes(duplicate.status))throw new Error('Duplicate has begun; inspect before cancelling');
            await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:40189384016});
            core.info('Kept 40189377057; cancelled only duplicate queued 40189384016.');
