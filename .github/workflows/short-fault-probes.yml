name: Verify pinned ICLabel native backend
on:
  push:
    branches: [codex/optimization-probes-20261025]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: ./PipeCompare/.github/actions/setup-2026
      - name: Prepare the pinned CPU-only compiler without Parallel Toolbox
        run: python PipeCompare/.github/scripts/prepare-iclabel-cpu.py eeglab/plugins/ICLabel/matconvnet
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            addpath(fullfile(pwd,'PipeCompare','benchmarks'));
            pipecompare_native_backend_probe(fullfile(pwd,'results'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-iclabel-native-backend
          path: |
            results
            eeglab/plugins/ICLabel/matconvnet/matlab/mex
          retention-days: 90
