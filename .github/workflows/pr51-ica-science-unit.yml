name: PR51 scientific ICA recorder isolated unit verification
on:
  push:
    branches: [codex/pr51-ica-science-recorder-20261112]
    paths:
      - +pipecompare/+research/IcaScience.m
      - +pipecompare/+run/Executor.m
      - pop_pipecompare.m
      - benchmarks/erpcore_pilot.m
      - benchmarks/validate_ica_science.py
      - tests/test_ica_science.py
      - .github/workflows/pr51-ica-science-unit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact analysis dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Train/unseen isolation and no invented EEG science evidence
        run: |
          python -m unittest discover -s tests -p test_ica_science.py -v
          python -m unittest discover -s tests -p test_ica_unseen_seeds.py -v
          python -m unittest discover -s tests -p test_ica_support_integrity.py -v
      - name: Check source change scope and no Measure or Rank alteration
        run: |
          test -z "$(git diff --name-only 626c6d3bfe6236d3f5d154de02e6985523ebd8dd HEAD -- +pipecompare/+eval/Measure.m +pipecompare/+eval/Rank.m)"
          git diff --check
