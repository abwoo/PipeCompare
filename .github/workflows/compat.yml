name: compatibility

# Starting with PR #50, current compatibility uses this pinned pair.
# Fast numerical suites run in matlab-tests.yml; all native EEGLAB, GUI
# and end-to-end suites remain here without a duplicate version matrix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compat:
    name: MATLAB R2026a + EEGLAB 2026.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PipeCompare
        uses: actions/checkout@v4
        with:
          path: PipeCompare

      - uses: ./PipeCompare/.github/actions/setup-2026

      - name: Run tests
        timeout-minutes: 105
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp(version); addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            r = run_all({'test_simple', 'test_main', 'test_eeglab', 'test_signal', 'test_engine', 'test_checkpoint_delivery'});
            assert(~any([r.Failed]), 'PipeCompare:CI', '%d test(s) failed', sum([r.Failed]));
