name: methodology-audit-probe
on:
  workflow_dispatch:
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Reproduce methodology edge cases
        timeout-minutes: 15
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd, fullfile(pwd,'tests'));
            s=matlab.unittest.TestSuite.fromFile(fullfile(pwd,'tests','test_methodology.m'));
            names={'testArtifactBias','testGroupVariance','testGroupPaired','testGroupDiagonal','testMultitaperEndpoints'};
            s=s(contains({s.Name},names));
            assert(numel(s)==6);
            runner=matlab.unittest.TestRunner.withTextOutput('OutputDetail',3);
            r=runner.run(s);
            fprintf('TOTAL=%d PASSED=%d FAILED=%d\n',numel(r),sum([r.Passed]),sum([r.Failed]));
            assert(all([r.Passed]),'PipeCompare:Audit','Methodology regressions failed');
