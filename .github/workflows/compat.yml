name: methodology-audit-probe
on:
  workflow_dispatch:
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: Signal_Processing_Toolbox
      - name: Statistical and methodological regression suites
        timeout-minutes: 20
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd,fullfile(pwd,'tests'));
            r=run_all({'test_statistics','test_methodology'});
            fprintf('TOTAL=%d PASSED=%d FAILED=%d SKIPPED=%d\n',numel(r),sum([r.Passed]),sum([r.Failed]),sum([r.Incomplete]));
            assert(~any([r.Failed]),'PipeCompare:Audit','Methodology regressions failed');
