name: legacy-window-fixed-diagnostic

on:
  workflow_dispatch:

jobs:
  probe:
    name: Legacy ${{ matrix.matlab }} result window with CI dialog stand-in
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        matlab: [R2022b, R2023a]
    steps:
      - name: Checkout PipeCompare
        uses: actions/checkout@v4
        with:
          path: PipeCompare
      - name: Checkout EEGLAB
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - name: Start display
        timeout-minutes: 10
        run: bash PipeCompare/.github/scripts/start-display.sh
      - name: Set up MATLAB
        timeout-minutes: 15
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab }}
      - name: Test actual results window and replay
        timeout-minutes: 10
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            addpath(fullfile(pwd, 'tests', 'shims'));
            assert(contains(which('uiprogressdlg'), [filesep 'tests' filesep 'shims' filesep]));
            f = uifigure('Visible', 'off');
            d = uiprogressdlg(f, 'Title', 'Lifecycle', 'Message', 'Check close', 'Indeterminate', 'on');
            assert(isvalid(d)); close(d); assert(~isvalid(d)); delete(f);
            s = matlab.unittest.TestSuite.fromFile(fullfile(pwd, 'tests', 'test_simple.m'));
            s = s(endsWith({s.Name}, '/testResultsWindow'));
            assert(isscalar(s));
            runner = matlab.unittest.TestRunner.withTextOutput('OutputDetail', 3);
            r = runner.run(s);
            assert(all([r.Passed]), 'PipeCompare:CI', 'Results-window test did not pass');
