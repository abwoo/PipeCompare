name: legacy-window-diagnostic

on:
  workflow_dispatch:

jobs:
  probe:
    name: Native R2023a ${{ matrix.probe }} probe
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: [progress]
    steps:
      - name: Checkout PipeCompare
        uses: actions/checkout@v4
        with:
          path: PipeCompare
      - name: Start display
        timeout-minutes: 10
        run: bash PipeCompare/.github/scripts/start-display.sh
      - name: Set up MATLAB
        timeout-minutes: 10
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023a
      - name: Probe native UI component
        timeout-minutes: 3
        env:
          PC_GUI_PROBE: ${{ matrix.probe }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp(version);
            fprintf('[probe] creating figure\n');
            f = uifigure('Name', 'PipeCompare native UI probe', 'Visible', 'on');
            cleanup = onCleanup(@() delete(f));
            fprintf('[probe] figure ready\n');
            drawnow;
            fprintf('[probe] figure rendered\n');
            if strcmp(getenv('PC_GUI_PROBE'), 'selection')
                t = uitable(f, 'Data', {'1', 'passed'; '2', 'passed'});
                fprintf('[probe] table ready\n');
                t.Selection = [2 1];
                fprintf('[probe] selection set\n');
                selection = t.Selection;
                assert(isequal(selection, [2 1]), 'Unexpected selection');
                fprintf('[probe] selection read\n');
            else
                fprintf('[probe] creating progress dialog\n');
                d = uiprogressdlg(f, 'Title', 'Probe', 'Message', 'Testing native progress', 'Indeterminate', 'on');
                fprintf('[probe] progress dialog ready\n');
                close(d);
                fprintf('[probe] progress dialog closed\n');
            end
