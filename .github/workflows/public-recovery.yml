name: verify public benchmark clock measurements
on:
  push:
    branches: [codex/verify-spectral-20261023]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-validation-3
          path: timing_source
          run-id: 39947982777
          github-token: ${{ github.token }}
      - run: python3 .github/scripts/check-native-timing.py
