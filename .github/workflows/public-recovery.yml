name: verify legacy ocular counterexample and stop obsolete analyses

on:
  push:
    branches: [codex/verify-spectral-20261023]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const old={
              39949671591:'4ece3f7ee1b9ff8781d684c2845f49cb17cc3d01',
              39953695354:'b74d269e792abfe0b24d5e89f6d7f8a991175f5e'
            };
            for(const [id,sha]of Object.entries(old)) {
              const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
              if(r.data.name!=='validation result summaries'||r.data.head_sha!==sha)
                throw new Error('Unexpected analysis run');
              if(r.data.status!=='completed')
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:Number(id)});
            }

  counterexample:
    name: Reproduce legacy all-missing ocular false assessment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - name: Checkout EEGLAB 2026
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - name: Bound dependency downloads
        run: bash PipeCompare/.github/scripts/prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            cd PipeCompare;addpath(pwd);addpath(fullfile(pwd,'tests'));
            EEG=nqc_synth(struct('seconds',90,'nPerCond',20,'artifactTrials',0,'blinkRate',0));
            eyes=pipecompare.eval.Injection.eyeChannels(EEG.chanlocs);assert(~isempty(eyes));
            c=nqc_contract();quiet=EEG;quiet.data(eyes,:,:)=0;
            ref=pipecompare.eval.Measure.reference(quiet,c);
            good=pipecompare.eval.Measure.candidate(quiet,c,ref);
            assert(all(isfinite(good.objectives.eyeBiasSq)),'Quiet control is not assessable');
            EEG.data(eyes,:,:)=NaN;
            ref=pipecompare.eval.Measure.reference(EEG,c);
            m=pipecompare.eval.Measure.candidate(EEG,c,ref);
            cand=nqc_cand(m.objectives.X{1});cand.m=m;
            opts=pipecompare.eval.Rank.defaults();opts.nBoot=99;opts.nSplits=0;
            R=pipecompare.eval.Rank.run(cand,ref,opts);
            result=struct('baselineCoreHead','4ece3f7ee1b9ff8781d684c2845f49cb17cc3d01', ...
                'allOcularSamplesMissing',true,'finiteNeuralEstimate',all(isfinite(m.objectives.estimate)), ...
                'legacyBiasAssessed',all(m.objectives.eyeBiasAssessed),'legacySquaredPenalty',m.objectives.eyeBiasSq, ...
                'legacyRecommendation',R.recommended);
            fprintf('PIPECOMPARE_MISSING_EYE_COUNTEREXAMPLE_JSON %s\n',jsonencode(result));
            assert(result.finiteNeuralEstimate&&result.legacyBiasAssessed&&~isempty(R.recommended), ...
                'PipeCompare:Validation','The pre-repair false assessment did not reproduce');
