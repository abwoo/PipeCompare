name: recover complete public CSV metrics without refitting

on:
  push:
    branches: [codex/verify-spectral-20261023]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: public-validation-[0-5]
          path: recovered
          run-id: 39938907558
          github-token: ${{ github.token }}
      - name: Independently compute record-balanced derived metrics
        run: python3 .github/scripts/recover-public-metrics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-public-metrics
          path: recovered_summary
          retention-days: 90
