name: recover one stalled public validation shard

# Infrastructure-only recovery of shard 4. The original participant IDs,
# generator, rules, seeds and analysis remain fixed. Each other source
# artifact is copied once; no additional participant is created by recovery.
on:
  push:
    branches: [codex/verify-spectral-20261023]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Public EEG shard ${{ matrix.shard }} (R2026a / EEGLAB 2026)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [4]
    steps:
      - name: Checkout frozen PipeCompare revision
        uses: actions/checkout@v4
        with:
          path: PipeCompare

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned data readers
        run: python -m pip install numpy==2.2.6 scipy==1.15.3

      - name: Download and checksum public data
        timeout-minutes: 20
        run: python PipeCompare/benchmarks/fetch_open_data.py --shard ${{ matrix.shard }} --out public_data

      - name: Checkout EEGLAB 2026.0.0
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab

      - name: Bound MATLAB dependency downloads
        if: runner.os == 'Linux'
        run: bash PipeCompare/.github/scripts/prepare-matlab.sh

      - name: Start a virtual display
        timeout-minutes: 10
        run: bash PipeCompare/.github/scripts/start-display.sh

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox

      - name: Run independent measurements and complete per-recording refits
        timeout-minutes: 270
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab')); eeglab nogui;
            addpath(fullfile(pwd,'PipeCompare')); addpath(fullfile(pwd,'PipeCompare','benchmarks'));
            pipecompare_open_validation(fullfile(pwd,'public_data'),fullfile(pwd,'results'),${{ matrix.shard }});

      - name: Keep metrics and provenance, including unsuccessful evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-validation-${{ matrix.shard }}
          path: results
          retention-days: 90

  collect:
    name: Reuse five completed shards and stop a stalled installer
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wait for the five source calculations
        uses: actions/github-script@v7
        with:
          script: |
            const id=39947982777,sha='4a3ee082820873b04989ec336317e1bfebe65ffa';
            const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:id});
            if(r.data.head_sha!==sha) throw new Error('Unexpected frozen source revision');
            for(let n=0;n<180;n++) {
              const all=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:id,filter:'latest',per_page:100});
              const shards=all.filter(j=>/^public \/ Public EEG shard [0-5] /.test(j.name));
              const others=shards.filter(j=>!j.name.includes('shard 4 '));
              if(others.length===5&&others.every(j=>j.status==='completed')) {
                const old=shards.find(j=>j.name.includes('shard 4 '));
                const step=old?.steps?.find(s=>s.status==='in_progress');
                if(old?.status==='in_progress'&&step?.name==='Set up MATLAB R2026a') {
                  await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:id});
                  core.info('Stopped the source only after all five useful calculations completed; the remaining shard was still installing');
                }
                core.info('Five source conclusions: '+others.map(j=>j.conclusion).join(', '));return;
              }
              if(n%10===0)core.info('Waiting for five native source shards; completed '+others.filter(j=>j.status==='completed').length);
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error('Five source shards did not complete in 90 minutes');
      - uses: actions/download-artifact@v4
        with:
          pattern: public-validation-[01235]
          path: recovered
          run-id: 39947982777
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-0
          path: recovered/public-validation-0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-1
          path: recovered/public-validation-1
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-2
          path: recovered/public-validation-2
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-3
          path: recovered/public-validation-3
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-5
          path: recovered/public-validation-5
          if-no-files-found: error
          retention-days: 90

  summarize:
    name: Analyze the complete frozen participant cohort
    if: always()
    needs: [validate, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: public-validation-[0-5]
          path: public_results
      - name: Bound dependency downloads
        run: bash .github/scripts/prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd);addpath(fullfile(pwd,'benchmarks'));
            pipecompare_open_summary(fullfile(pwd,'public_results'),fullfile(pwd,'validation_summary'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-validation-summary
          path: validation_summary
          retention-days: 90
