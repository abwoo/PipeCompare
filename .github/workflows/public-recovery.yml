name: stop obsolete pre-repair simulations
on:
  push:
    branches: [codex/verify-spectral-20261023]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const freshId=39969962494,oldId=39936975660;
            const fresh=await github.rest.actions.getWorkflowRun({...context.repo,run_id:freshId});
            if(fresh.data.head_sha!=='fa295f983d1b516d711adda85f76176cf4e67af5'||fresh.data.name!=='benchmark')
              throw new Error('Unexpected replacement validation');
            const now=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:freshId,filter:'latest',per_page:100});
            const gate=now.find(j=>j.name==='Plan scientific records and check requested validation');
            if(gate?.conclusion!=='success'||now.filter(j=>/^Ground-truth benchmark record /.test(j.name)).length!==30)
              throw new Error('Replacement numerical gate and matrix are not ready');
            const old=await github.rest.actions.getWorkflowRun({...context.repo,run_id:oldId});
            if(old.data.head_sha!=='a3169a67e8a1135f1a6f9d993ffe96f63f81f49f'||old.data.name!=='benchmark')
              throw new Error('Unexpected obsolete simulation run');
            if(old.data.status==='completed'){core.info('Old run already completed');return;}
            try{await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:oldId});}
            catch(e){if(e.status!==409)throw e;}
            for(let n=0;n<18;n++) {
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:oldId,filter:'latest',per_page:100});
              const native=jobs.filter(j=>/^Ground-truth benchmark shard [0-5]$/.test(j.name));
              if(native.length===6&&native.every(j=>j.status==='completed')){
                const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:oldId});
                if(r.data.status!=='completed')await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{...context.repo,run_id:oldId});
                core.info('Stopped obsolete code after the native jobs and their always-run result uploads ended');return;
              }
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Old jobs did not stop; review before forcing anything');
