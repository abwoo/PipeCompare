name: Audit artifact flags and comparison-trial retention
on:
  push:
    branches: [codex/pr51-support-audit-20261104]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41790407556
          pattern: eog-pair-*
          path: fragments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Reconstruct exact original public inputs
        run: |
          python PipeCompare/benchmarks/fetch_public_pilot.py --subject 4 --out input/4
          python PipeCompare/benchmarks/fetch_public_pilot.py --subject 5 --out input/5
      - name: Checkout original EEGLAB release (no ICA inference required)
        run: git clone --depth 1 --branch 2026.0.0 https://github.com/sccn/eeglab.git eeglab
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            addpath(fullfile(pwd,'PipeCompare'));addpath(fullfile(pwd,'PipeCompare','benchmarks','support_audit'));
            audit_support(fullfile(pwd,'input'),fullfile(pwd,'fragments'),fullfile(pwd,'support_results'));
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-support-audit
          path: support_results
          retention-days: 90
