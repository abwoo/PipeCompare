name: PR51 ICA estimator-family scientific gate independent Python tests
on:
  push:
    branches: [codex/pr51-ica-estimator-family-20261112]
    paths:
      - benchmarks/validate_ica_family_real.py
      - tests/test_ica_family_real.py
      - .github/workflows/pr51-ica-family-audit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original scientific Rank constraints and weighted-estimator provenance
        run: |
          python -m unittest discover -s tests -p test_ica_family_real.py -v
          python -m unittest discover -s tests -p test_ica_robust_real.py -v
