name: PR51 order-invariant ICA rank research unit regression
on:
  push:
    branches: [codex/pr51-ica-rank-control-20261112]
    paths:
      - .github/workflows/pr51-ica-rank-control-unit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
          fetch-depth: 0
      - name: Verify frozen original Rank and Measure remain unmodified
        working-directory: PipeCompare
        run: |
          base=30a5f9a468d987a9cdbb095ecc4da62abc024fa8
          test -z "$(git diff --name-only "$base" HEAD -- +pipecompare/+eval/Rank.m +pipecompare/+eval/Measure.m)"
          git diff --check
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - name: Check rank remains invariant under permutations that change 3000-point rank
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'PipeCompare'));
            r=runtests(fullfile(pwd,'PipeCompare','tests','test_ica_rank.m'));
            assert(all([r.Passed]),'PipeCompare:IcaRankTest','Rank policy MATLAB regression failed.');
