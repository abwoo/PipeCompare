name: Independent-background HMM diagnostic
on:
  push:
    branches: [codex/pr51-detector-validation-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python benchmarks/detector_validation/fetch.py
      - run: bash .github/scripts/pilot-prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd); addpath(fullfile(pwd,'benchmarks','detector_validation')); run_validation(fullfile(pwd,'detector_results'));
      - run: python benchmarks/detector_validation/verify.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-validation-results
          path: detector_results
          retention-days: 90
