name: PR51 ERP CORE P3 candidate finite-guard record
on:
  workflow_call:
    inputs:
      subject:
        type: number
        required: true
permissions:
  contents: read
jobs:
  record:
    name: ERP CORE P3 participant ${{ inputs.subject }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DISPLAY: ':99'
      PILOT_SUBJECT: ${{ inputs.subject }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Verify production diff is restricted to IcThreshold.m
        working-directory: PipeCompare
        run: |
          base=$(python -c "import json;print(json.load(open('benchmarks/erpcore_protocol.json'))['algorithm_commit'])")
          files=$(git diff --name-only "$base" HEAD -- +pipecompare pop_pipecompare.m eegplugin_pipecompare.m fallback pcomp.m pipecompare_setup.m)
          test "$files" = '+pipecompare/+eval/IcThreshold.m' || { printf 'Unexpected production changes:\n%s\n' "$files"; exit 1; }
          git diff --check "$base" HEAD -- +pipecompare/+eval/IcThreshold.m
      - name: Verify frozen Measure identity
        run: |
          python - <<'PYCODE'
          import json,hashlib,os
          from pathlib import Path
          r=Path('PipeCompare');p=json.loads((r/'benchmarks/erpcore_protocol.json').read_text())
          assert hashlib.sha256((r/'+pipecompare/+eval/Measure.m').read_bytes()).hexdigest()==p['baseline_measure_sha256']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PILOT_MEASURE_SHA256='+p['baseline_measure_sha256']+'\n')
          PYCODE
      - name: Fetch and checksum one ERP CORE P3 excerpt
        timeout-minutes: 15
        run: python PipeCompare/benchmarks/fetch_erpcore.py --subject "$PILOT_SUBJECT" --out input
      - name: Checkout pinned EEGLAB version
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - name: Record EEG implementation identity
        run: echo "EEGLAB_SHA=$(git -C eeglab rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bound Linux dependency downloads
        run: bash PipeCompare/.github/scripts/pilot-prepare-matlab.sh
      - name: Install matching CPU compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-12
      - name: Start virtual display
        timeout-minutes: 5
        run: bash PipeCompare/.github/scripts/start-display.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
      - name: Prepare pinned ICLabel CPU build
        run: python PipeCompare/.github/scripts/pilot-iclabel-cpu.py eeglab/plugins/ICLabel/matconvnet
      - name: Verify native ICLabel and support recorder
        timeout-minutes: 12
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            addpath(fullfile(pwd,'PipeCompare'));addpath(fullfile(pwd,'PipeCompare','benchmarks'));
            pilot_native_backend(fullfile(pwd,'result','backend'));
            erpcore_pilot();
      - name: Record full Standard search, comparators, and replay outcomes
        timeout-minutes: 90
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            plugin=fileparts(which('pop_iclabel'));addpath(fullfile(plugin,'matconvnet','matlab'));vl_setupnn;
            assert(exist('vl_nnconv','file')==3,'Native inference not active.');
            addpath(fullfile(pwd,'PipeCompare'));addpath(fullfile(pwd,'PipeCompare','benchmarks'));
            erpcore_pilot(fullfile(pwd,'input'),fullfile(pwd,'result'),str2double(getenv('PILOT_SUBJECT')));
      - name: Print caught icremove stack trace from saved MATLAB transcript
        if: always()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path("result/standard.log")
          if not p.exists():
              print("PR51_TRACE transcript absent")
          else:
              lines = p.read_text(errors="replace").splitlines()
              hits = [i for i, x in enumerate(lines) if "PR51_ICREMOVE_STACK subject=" in x]
              print("PR51_TRACE_COUNT", len(hits))
              for i in hits[:3]:
                  for line in lines[i:i+24]:
                      print("PR51_TRACE", line[:600])
              if not hits:
                  for line in lines:
                      if "FAILED icremove" in line or "Unable to perform assignment" in line:
                          print("PR51_ORIGINAL_FAILURE", line[:600])
          PYCODE
      - name: Check record completion before scheduling the remaining subjects
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          x=json.loads((Path('result')/'result.json').read_text())
          assert x['completed'], x['errors']
          assert x['notRun']==0
          PYCODE
      - name: Stamp variant identity without altering frozen protocol
        if: always()
        run: |
          python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          source=Path('PipeCompare/+pipecompare/+eval/IcThreshold.m').read_bytes()
          out=Path('result');out.mkdir(parents=True,exist_ok=True)
          data={
            "analysis_type":"UNCONFIRMED_CANDIDATE_FIX",
            "do_not_use_frozen_collector":True,
            "production_algorithm_modified":True,
            "variant_execution_sha":os.environ.get("GITHUB_SHA"),
            "modified_source":" +pipecompare/+eval/IcThreshold.m".strip(),
            "modified_source_sha256":hashlib.sha256(source).hexdigest(),
            "original_frozen_algorithm_commit":json.loads(Path('PipeCompare/benchmarks/erpcore_protocol.json').read_text())['algorithm_commit'],
            "original_frozen_workflow_run":42809789847,
            "subject":int(os.environ['PILOT_SUBJECT'])}
          (out/'VARIANT_MANIFEST.json').write_text(json.dumps(data,indent=2))
          print("PR51_VARIANT_MANIFEST",json.dumps(data))
          PYCODE
      - name: Preserve completed results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-erpcore-finite-fix-${{ inputs.subject }}-attempt-${{ github.run_attempt }}
          path: result
          retention-days: 90
          if-no-files-found: warn
