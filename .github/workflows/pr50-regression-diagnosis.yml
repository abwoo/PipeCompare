name: Inspect saved PR50 error components
on:
  push:
    branches: [codex/pr50-regression-diagnosis-20261027]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: development-optimization-*-summary
          path: source_results
          run-id: 40282756637
          github-token: ${{ github.token }}
      - name: Read saved components without fitting candidates
        run: python benchmarks/diagnose_bias_components.py
