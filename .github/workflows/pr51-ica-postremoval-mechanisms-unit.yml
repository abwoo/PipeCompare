name: PR51 original ICA step deletion vs downstream P300 mechanism unit science
on:
  push:
    branches: [codex/pr51-ica-postremoval-mechanisms-20261113]
    paths:
      - benchmarks/ica_postremoval_mechanisms.py
      - tests/test_ica_postremoval_mechanisms.py
      - .github/workflows/pr51-ica-postremoval-mechanisms-unit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm no original MATLAB source edits
        run: |
          test -z "$(git diff --name-only 19fb39a1be3ebcf0a5cbeae7c614b0cff142dde3 HEAD -- +pipecompare pop_pipecompare.m)"
          git diff --check
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Test actual ICA removal and stage selection conservation
        run: |
          python -m unittest discover -s tests -p test_ica_postremoval_mechanisms.py -v
          python -m unittest discover -s tests -p test_ica_postremoval.py -v
          python -m unittest discover -s tests -p test_ica_stage_selection_decomp.py -v
          python -m unittest discover -s tests -p test_ica_contribution.py -v
