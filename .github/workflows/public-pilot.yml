name: Ten short public EEG validation
on:
  push:
    branches: [codex/pr51-public-pilot-20261103]
    paths:
      - 'benchmarks/public_pilot*'
      - 'benchmarks/fetch_public_pilot.py'
      - 'benchmarks/summarize_public_pilot.py'
      - 'benchmarks/pilot_native_backend.m'
      - 'tests/test_public_pilot.py'
      - '.github/scripts/pilot-*'
      - '.github/workflows/public-pilot*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: public-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m unittest discover -s tests -p test_public_pilot.py -v
      - run: python -m py_compile benchmarks/fetch_public_pilot.py benchmarks/summarize_public_pilot.py
  first:
    needs: verify
    uses: ./.github/workflows/public-pilot-record.yml
    with:
      subject: 1
  remaining:
    needs: first
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        subject: [2,3,4,5,6,7,8,9,10]
    uses: ./.github/workflows/public-pilot-record.yml
    with:
      subject: ${{ matrix.subject }}
  collect:
    if: always()
    needs: [verify,first,remaining]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: public-pilot-*
          path: fragments
      - name: Independently recompute every planned record and paired result
        run: python benchmarks/summarize_public_pilot.py fragments pilot_summary
      - name: Publish coverage even when execution is incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pilot-summary
          path: pilot_summary
          retention-days: 90
          if-no-files-found: warn
      - name: Display the scoped interpretation
        if: always()
        run: |
          if [ -f pilot_summary/summary.md ]; then cat pilot_summary/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
