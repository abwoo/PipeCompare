name: PR51 real P3 per-seed ICA measurement stability (exploratory)
on:
  push:
    branches:
      - codex/pr51-ica-measure-stability-20261112
    paths:
      - .github/workflows/pr51-ica-measure.yml
      - .github/workflows/pr51-ica-measure-record.yml
      - .github/scripts/pr51-instrument-ica-measure.py
      - tests/test_ica_measure_instrument.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-measure:
    name: Actual P3 amplitude and SE across ICA seeds, participant ${{ matrix.subject }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        subject: [11, 15, 21]
    uses: ./.github/workflows/pr51-ica-measure-record.yml
    with:
      subject: ${{ matrix.subject }}
