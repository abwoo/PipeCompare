name: matlab-tests

# Fast numerical suites. Native EEGLAB, GUI and end-to-end suites run in
# compat.yml on the same pinned MATLAB R2026a / EEGLAB 2026.0.0 pair.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: MATLAB tests without GUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PipeCompare
        uses: actions/checkout@v4
        with:
          path: PipeCompare

      - name: Checkout EEGLAB
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab

      - name: Bound MATLAB dependency downloads
        if: runner.os == 'Linux'
        run: bash PipeCompare/.github/scripts/prepare-matlab.sh

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            r = run_all({'test_history', 'test_plan', 'test_panel_text', 'test_statistics', 'test_methodology', 'test_algorithm_regressions', 'test_invariants'});
            assert(~any([r.Failed]), 'PipeCompare:CI', '%d test(s) failed', sum([r.Failed]));
