name: Optical blink reference diagnostic
on:
  push:
    branches: [codex/pr51-eye-reference-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python benchmarks/eye_reference/prepare.py
      - run: bash .github/scripts/pilot-prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd);addpath(fullfile(pwd,'benchmarks','eye_reference'));run_reference(fullfile(pwd,'eye_reference_results'));
      - run: python benchmarks/eye_reference/evaluate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-reference-results
          path: eye_reference_results
          retention-days: 90
