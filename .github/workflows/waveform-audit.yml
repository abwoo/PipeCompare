name: Verify waveform samples and render diagnostic plots
on:
  push:
    branches: [codex/pr51-waveform-audit-20261104]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41830489631
          name: waveform-audit-results
          path: input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 matplotlib==3.10.3
      - run: python benchmarks/waveform_audit/verify_plot.py input verified
      - uses: actions/upload-artifact@v4
        with:
          name: verified-waveform-plots
          path: verified
          retention-days: 90
