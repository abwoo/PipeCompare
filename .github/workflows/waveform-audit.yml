name: Inspect HMM intervals and trial 23 rejection
on:
  push:
    branches: [codex/pr51-waveform-audit-20261104]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41790407556
          name: eog-pair-5-0
          path: saved
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python PipeCompare/benchmarks/fetch_public_pilot.py --subject 5 --out input
      - run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - run: bash PipeCompare/.github/scripts/pilot-prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            addpath(fullfile(pwd,'PipeCompare'));addpath(fullfile(pwd,'PipeCompare','benchmarks','waveform_audit'));
            run_waveform_audit(fullfile(pwd,'input'),fullfile(pwd,'saved'),fullfile(pwd,'waveform_results'));
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveform-audit-results
          path: waveform_results
          retention-days: 90
