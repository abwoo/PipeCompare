name: PR51 stage 3 ICA mechanism archive schema (no EEG refit)
on:
  push:
    branches: [codex/pr51-ica-mechanism-audit-20261112]
    paths:
      - benchmarks/inspect_ica_mechanism_archive.py
      - benchmarks/diagnose_ica_mechanism.py
      - tests/test_ica_mechanism.py
      - .github/workflows/pr51-ica-mechanism.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          repository: abwoo/PipeCompare
          run-id: 43169562528
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: pr51-icthreshold-dev-*-attempt-1
          path: evidence
      - name: Regress zero-IC-removal logic and scientific support
        run: |
          python -m unittest discover -s tests -p test_ica_mechanism.py -v
          python -m unittest discover -s tests -p test_ica_unseen_seeds.py -v
      - name: Check real MATLAB archive fields for ICA-no-op confounding
        run: python benchmarks/inspect_ica_mechanism_archive.py
      - name: Compute objective, support and P300 findings from archived real data
        run: |
          python benchmarks/diagnose_ica_mechanism.py \
            --evidence evidence --out output/ica_mechanism.json
      - name: Archive source-backed mechanistic investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-ica-mechanism-${{ github.run_id }}
          path: output/
          retention-days: 90
          if-no-files-found: warn
