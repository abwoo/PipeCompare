name: frozen spectral and frequency-grid diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Stop superseded summary waiters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sources={
              39942401781:'a7133f37b1df7882c16eae55815b827be20a35ec',
              39947982839:'4a3ee082820873b04989ec336317e1bfebe65ffa',
              39949319094:'d2602541228d67c738f5c40f5adf930cdbf0aeab'
            };
            for (const [id,sha] of Object.entries(sources)) {
              const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
              if (r.data.name!=='validation result summaries'||r.data.head_sha!==sha)
                throw new Error('Refusing to cancel a source that differs from the superseded summary');
              if (r.data.status!=='completed') {
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:Number(id)});
                core.info('Cancelled superseded summary '+id);
              }
            }

  spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bound dependency downloads
        run: bash .github/scripts/prepare-matlab.sh
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd);addpath(fullfile(pwd,'benchmarks'));
            pipecompare_spectral_validation(fullfile(pwd,'spectrum_results'));
            cases=[100.1 328;160.1 416;200.1 328;250.003 264;250.1 264];
            rows={};
            for q=1:size(cases,1)
                fs=cases(q,1);n=cases(q,2);band=[fs/2-fs/n/10 fs/2];
                H=pipecompare.eval.Measure.tapers(n,fs,band);
                X=(-1).^(0:n-1);F=fft(X'.*H(:,1));
                expected=log10(abs(F(n/2+1))^2/(fs*sum(H(:,1).^2)));
                actual=pipecompare.eval.Measure.bandScores(X,fs,band);
                f=(0:n-1)*fs/n;sel=f>=band(1)&f<=band(2);
                side=2*ones(nnz(sel),1);
                side(f(sel)==0|(mod(n,2)==0&f(sel)==fs/2))=1;
                legacy=log10(mean(side.*abs(F(sel)).^2/(fs*sum(H(:,1).^2))));
                rows(end+1,:)={fs,n,expected,actual,legacy,actual-expected,isfinite(actual)&&abs(actual-expected)<1e-10};
            end
            T=cell2table(rows,'VariableNames',{'fs','samples','expected','actual','legacyActual','difference','passed'});
            fprintf('PIPECOMPARE_GRID_JSON %s\n',jsonencode(table2struct(T)));
            writetable(T,fullfile(pwd,'spectrum_results','grid.csv'));
            assert(all(T.passed),'PipeCompare:Validation','Fractional-frequency endpoint repair failed.');
            assert(any(~isfinite(T.legacyActual)|abs(T.legacyActual-T.expected)>0.1),'PipeCompare:Validation','The legacy-grid counterexample was not reproduced.');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-spectrum-diagnostics
          path: spectrum_results
          retention-days: 90
