name: PR50 review fixes on MATLAB 2026
on:
  push:
    branches: [codex/pr50-review-fixes-20261027]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr50-isolated-review-fixes
  cancel-in-progress: false
jobs:
  artifact-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test split, admission, provenance and transactional result collection
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Read completed artifacts from the existing run without rerunning it
        uses: actions/download-artifact@v4
        with:
          pattern: development-synthetic-*-*-slice-4
          path: existing_artifacts
          run-id: 40282756637
          github-token: ${{ github.token }}
      - name: Validate existing evidence at its original revision
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'benchmarks')
          from prepare_synthetic_slice import prepare
          protocol=json.loads(Path('benchmarks/optimization_protocol.json').read_text())
          revision='4116ea11f3d5d39e4d3d282894dcf487172bd50d'
          checked=finished=0
          for snapshot in sorted(Path('existing_artifacts').glob('*/*/snapshot.json')):
              token=json.loads(snapshot.read_text())
              assert token['stage']=='development' and token['revision']==revision
              done=prepare(snapshot.parent.parent,None,token['seed'],token['recipe'],'development',revision,protocol)
              print(json.dumps(dict(seed=token['seed'],recipe=token['recipe'],completed=done)))
              checked+=1;finished+=done
          assert checked>=7 and finished>=7, 'Expected the seven already completed arms'
          print('Validated existing artifacts at '+revision+'; this does not certify the modified detector.')
          PY
  matlab-regressions:
    needs: artifact-guards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: ./PipeCompare/.github/actions/setup-2026
      - name: Numerical, methodology and native checkpoint regressions
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd,'eeglab'));eeglab nogui;
            cd PipeCompare;addpath(pwd);addpath(fullfile(pwd,'tests'));
            mkdir('review_artifacts');diary(fullfile('review_artifacts','matlab.log'));
            assert(strcmp(version('-release'),'2026a'),'Wrong MATLAB release');
            r=run_all({'test_statistics','test_methodology','test_invariants'});
            required={'testMultiscaleCoversStrongFaultInTerminalRemainder','testMultiscaleTerminalWindowDoesNotRepairQuietNoise', ...
              'testMultitaperAgreesWithIndependentDpssPeriodograms','testGroupValidationRejectsOverlappingAndRepeatedCohorts', ...
              'testGroupValidationRejectsDuplicateOrMalformedRecordIdentities','testGroupValidationKeepsMissingCohortExplicit'};
            names=reshape(string({r.Name}),size(r));newCases=false(size(r));
            for k=1:numel(required),newCases=newCases|endsWith(names,['/' required{k}]);end
            assert(nnz(newCases)==numel(required)&&all([r(newCases).Passed]),'New regression cases must execute and pass');
            assert(~any([r.Failed]),'Numerical or methodology regression failed');
            suite=testsuite(fullfile('tests','test_engine.m'));names=reshape(string({suite.Name}),size(suite));
            required={'testIcaCheckpointPreservesNativeOutputAndRandomState','testResumeRetainsIcaSeedsAndRecommendation','testTimeSliceRequiresCheckpointAndCanResume'};
            pick=false(size(suite));
            for k=1:numel(required),pick=pick|endsWith(names,['/' required{k}]);end
            assert(nnz(pick)==3,'Missing checkpoint regression cases');
            native=run(suite(pick));disp(table(native));
            assert(all([native.Passed]),'Native checkpoint regression failed');
            fprintf('REVIEW_TOTAL=%d PASSED=%d FAILED=%d SKIPPED=%d\n',numel(r)+numel(native), ...
              nnz([r.Passed])+nnz([native.Passed]),nnz([r.Failed])+nnz([native.Failed]),nnz([r.Incomplete])+nnz([native.Incomplete]));
            diary off;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr50-review-regressions
          path: PipeCompare/review_artifacts
          if-no-files-found: warn
          retention-days: 30
