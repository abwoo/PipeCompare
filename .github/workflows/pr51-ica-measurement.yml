name: PR51 ICA seed-resolved real-P3 scientific measurement audit
on:
  push:
    branches: [codex/pr51-ica-measurement-20261112]
    paths:
      - +pipecompare/+run/Executor.m
      - benchmarks/validate_ica_seed_measurements.py
      - tests/test_ica_seed_measurements.py
      - .github/workflows/pr51-ica-measure-record.yml
      - .github/workflows/pr51-ica-measurement.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    name: ICA readout subject ${{ matrix.subject }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        subject: [11, 15, 21]
    uses: ./.github/workflows/pr51-ica-measure-record.yml
    with:
      subject: ${{ matrix.subject }}
  collect:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pr51-icthreshold-dev-*-attempt-*
          path: evidence
      - name: Validate gain-corrected P3, seed choice and support with tested analyzer
        shell: bash
        run: |
          mapfile -t files < <(find evidence -name result.json | sort)
          test "${#files[@]}" = 3 || { echo 'Need three real ERP CORE results'; exit 1; }
          python benchmarks/validate_ica_seed_measurements.py \
            --inputs "${files[@]}" --out output/seed_measurements.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          obj=json.loads(Path('output/seed_measurements.json').read_text())
          assert {x['subject'] for x in obj['subjects']} == {11,15,21}
          assert obj['exploratory'] and not obj['confirmatory']
          print('PR51_ICA_SEED_MEASUREMENT_VALIDATED',len(obj['subjects']))
          PYCODE
      - name: Preserve all negative and positive ICA seed measurements
        uses: actions/upload-artifact@v4
        with:
          name: pr51-ica-seed-measurements-${{ github.run_id }}
          path: output/
          retention-days: 90
