name: benchmark

# The ground-truth benchmark (benchmarks/pipecompare_benchmark.m): simulated
# recordings with a known P3, measured by the pipeline PipeCompare
# recommends and by common fixed pipelines. Long (an ICA per pipeline and
# recording, hours for 8 recordings). Manual runs and marked PR commits
# request scientific evaluation. Results are written after every recording
# and kept even when the run stops early.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Public independent EEG validation or known-truth simulations'
        type: choice
        options: [public, synthetic, summarize-synthetic]
        default: public
      recordings:
        description: 'number of simulated recordings'
        default: '30'
      first_seed:
        description: 'first seed (use a fresh range for validation)'
        default: '20031'
      source_run:
        description: 'Completed simulation run to summarize without repeating ICA (summary mode only)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  request:
    name: Plan scientific records and check requested validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run_public: ${{ steps.request.outputs.run_public }}
      run_synthetic: ${{ steps.request.outputs.run_synthetic }}
      records: ${{ steps.request.outputs.records }}
      recordings: ${{ steps.request.outputs.recordings }}
      first_seed: ${{ steps.request.outputs.first_seed }}
    steps:
      - id: request
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('run_public','false');core.setOutput('run_synthetic','false');
            const input=context.payload.inputs||{};
            const total=Number(input.recordings||30),first=Number(input.first_seed||20031);
            if(!Number.isSafeInteger(total)||total<1||total>256||!Number.isSafeInteger(first)||first<1)
              throw new Error('Record count must be 1-256 and first seed a positive integer');
            core.setOutput('records',JSON.stringify(Array.from({length:total},(_,i)=>i)));
            core.setOutput('recordings',String(total));core.setOutput('first_seed',String(first));
            if (context.eventName!=='pull_request') return;
            const sha=context.payload.pull_request.head.sha;
            const commit=await github.rest.repos.getCommit({...context.repo,ref:sha});
            const publicRequested=commit.data.commit.message.includes('[public-validation]');
            const syntheticRequested=commit.data.commit.message.includes('[synthetic-validation]');
            if (!publicRequested&&!syntheticRequested) return;
            for (let n=0;n<75;n++) {
              const runs=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'matlab-tests.yml',head_sha:sha,event:'pull_request',per_page:10
              });
              const run=runs.data.workflow_runs.find(r=>r.head_sha===sha);
              if (run&&run.status==='completed') {
                if (run.conclusion!=='success') throw new Error('Fast numerical/checkpoint tests did not pass');
                core.setOutput('run_public',String(publicRequested));
                core.setOutput('run_synthetic',String(syntheticRequested));return;
              }
              if (n%6===0) core.info('Waiting for the fast numerical/checkpoint tests');
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Fast numerical/checkpoint tests did not finish in time');

  public:
    needs: request
    if: (github.event_name == 'workflow_dispatch' && (inputs.suite == 'public' || inputs.suite == '')) || needs.request.outputs.run_public == 'true'
    uses: ./.github/workflows/open-validation.yml

  benchmark:
    needs: request
    if: inputs.suite == 'synthetic' || needs.request.outputs.run_synthetic == 'true'
    name: Ground-truth benchmark record ${{ matrix.record }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        record: ${{ fromJSON(needs.request.outputs.records) }}
    env:
      DISPLAY: ":99"
      PIPECOMPARE_BENCH_N: ${{ needs.request.outputs.recordings }}
      PIPECOMPARE_BENCH_FIRST: ${{ needs.request.outputs.first_seed }}
    steps:
      - name: Checkout PipeCompare
        uses: actions/checkout@v4
        with:
          path: PipeCompare

      - name: Checkout EEGLAB
        run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab

      - name: Bound MATLAB dependency downloads
        if: runner.os == 'Linux'
        run: bash PipeCompare/.github/scripts/prepare-matlab.sh

      - name: Start a virtual display
        timeout-minutes: 10
        run: bash PipeCompare/.github/scripts/start-display.sh

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox

      - name: Run the benchmark
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'benchmarks'));
            mkdir('bench_out');
            first=str2double(getenv('PIPECOMPARE_BENCH_FIRST'))+${{ matrix.record }};
            pipecompare_benchmark(1,fullfile(pwd,'bench_out'),first);

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.record }}
          path: PipeCompare/bench_out

  synthetic-summary:
    if: always() && (inputs.suite == 'synthetic' || inputs.suite == 'summarize-synthetic' || needs.request.outputs.run_synthetic == 'true')
    needs: [request, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIPECOMPARE_BENCH_N: ${{ needs.request.outputs.recordings }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: synthetic_results
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Bound MATLAB dependency downloads
        if: runner.os == 'Linux'
        run: bash ./.github/scripts/prepare-matlab.sh

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd); addpath(fullfile(pwd,'benchmarks'));
            pipecompare_synthetic_summary(fullfile(pwd,'synthetic_results'),fullfile(pwd,'synthetic_summary'),str2double(getenv('PIPECOMPARE_BENCH_N')));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-validation-summary
          path: synthetic_summary

