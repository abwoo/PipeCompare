name: PR51 ICA P1-P2 matching confidence vs ERP archival forensic
on:
  push:
    branches: [codex/pr51-ica-match-confidence-20261112]
    paths:
      - benchmarks/ica_match_confidence.py
      - tests/test_ica_match_confidence.py
      - docs/PR51_ICA_MATCH_CONFIDENCE_PROTOCOL_20261112.md
      - docs/PR51_ICA_MATCH_CONFIDENCE_RESULTS_20261112.md
      - .github/workflows/pr51-ica-match-confidence.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify only research code changed
        run: |
          test -z "$(git diff --name-only 57eb740a570a988169ec5be861519c03c319295f HEAD -- +pipecompare pop_pipecompare.m eegplugin_pipecompare.m)"
          git diff --check
      - name: Install pinned matching tools
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Check matching ambiguity and science parity cases
        run: |
          python -m unittest discover -s tests -p test_ica_match_confidence.py -v
          python -m unittest discover -s tests -p test_ica_component_outliers.py -v
          python -m unittest discover -s tests -p test_ica_science.py -v
          python -m unittest discover -s tests -p test_ica_multimetric.py -v
  audit:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent science tools
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Reuse verified six-start MATLAB science and parity artifacts only
        uses: actions/download-artifact@v4
        with:
          repository: abwoo/PipeCompare
          run-id: 43184910782
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: pr51-ica-science-dev-*-attempt-1
          path: evidence
      - name: Diagnose matching confidence and ERP co-variation on archived EEG
        run: |
          python benchmarks/ica_match_confidence.py \
            --evidence evidence --output output/matching_confidence.json
      - name: Archive all good/bad scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-match-confidence-p1p2-${{ github.run_id }}
          path: output/
          retention-days: 90
          if-no-files-found: warn
