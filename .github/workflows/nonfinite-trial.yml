name: Summarize nonfinite-score diagnosis
on:
  push:
    branches: [codex/pr51-nonfinite-20261104]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41825137589
          name: nonfinite-diagnosis-results
          path: input
      - run: python3 benchmarks/nonfinite_trial/summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-nonfinite-summary
          path: summary.json
          retention-days: 90
