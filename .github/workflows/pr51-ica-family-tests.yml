name: PR51 ICA estimator-family locked robust selector MATLAB scientific regression
on:
  push:
    branches: [codex/pr51-ica-estimator-family-20261112]
    paths:
      - +pipecompare/+eval/IcaRobustFamily.m
      - +pipecompare/+run/Executor.m
      - tests/test_ica_robust_family.m
      - .github/workflows/pr51-ica-family-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
      - name: Run original 13 ICA science-gates and 8 estimator-family robustness tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd PipeCompare;addpath(pwd);addpath(fullfile(pwd,'tests'));
            r1=runtests(fullfile('tests','test_ica_robust.m'),'OutputDetail',3);
            r2=runtests(fullfile('tests','test_ica_robust_family.m'),'OutputDetail',3);
            count=numel(r1)+numel(r2);
            good=sum([r1.Passed])+sum([r2.Passed]);
            bad=sum([r1.Failed])+sum([r2.Failed]);
            fprintf('PR51_ICA_FAMILY_TESTS total=%d passed=%d failed=%d\n',count,good,bad);
            assert(count==21 && good==21 && bad==0,'PipeCompare:CI','Original or family-science gate regression failed');
