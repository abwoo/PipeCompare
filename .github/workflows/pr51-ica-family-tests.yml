name: PR51 ICA estimator-family locked robust selector MATLAB scientific regression
on:
  push:
    branches: [codex/pr51-ica-estimator-family-20261112]
    paths:
      - +pipecompare/+eval/IcaRobustFamily.m
      - +pipecompare/+run/Executor.m
      - tests/test_ica_robust_family.m
      - .github/workflows/pr51-ica-family-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
      - name: Run original 13 ICA science-gates and 8 estimator-family robustness tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd PipeCompare;addpath(pwd);addpath(fullfile(pwd,'tests'));
            r=[runtests(fullfile('tests','test_ica_robust.m'),'OutputDetail',3); ...
               runtests(fullfile('tests','test_ica_robust_family.m'),'OutputDetail',3)];
            fprintf('PR51_ICA_FAMILY_TESTS total=%d passed=%d failed=%d\n', ...
                numel(r),sum([r.Passed]),sum([r.Failed]));
            assert(numel(r)==21 && all([r.Passed]),'PipeCompare:CI','Original or family-science gate regression failed');
